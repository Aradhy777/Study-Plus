{% extends "base.html" %}

{% block title %}StudyPulse | Add Session{% endblock %}

{% block content %}
<h1 class="page-title">Log Study Session</h1>

<div class="card" style="max-width: 500px;">
    <form method="POST" action="{{ url_for('add_session') }}">
        <div class="form-group">
            <label for="subject">Subject *</label>
            <select id="subject" name="subject" class="form-control" required>
                <option value="">Select a subject</option>
                {% for subject in subjects %}
                <option value="{{ subject.name }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" name="date" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="duration">Duration (minutes) *</label>
            <input type="number" id="duration" name="duration" class="form-control" required min="1">
        </div>
        
        <div class="form-group">
            <label for="productivity">Productivity Score (0-10)</label>
            <input type="number" id="productivity" name="productivity" class="form-control" min="0" max="10" step="0.5">
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Add Session</button>
            <a href="{{ url_for('sessions') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
