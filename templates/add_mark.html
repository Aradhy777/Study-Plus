{% extends "base.html" %}

{% block title %}StudyPulse | Record Marks{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-7 reveal">
        <div class="text-center mb-5">
            <h1 class="page-title">Grade <span class="text-gradient-primary">Entry</span></h1>
            <p class="text-muted">Document your academic achievements for performance tracking.</p>
        </div>

        <div class="card p-5 border-0 shadow-2xl">
            <form method="POST" action="{{ url_for('add_mark') }}">
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="subject" class="form-label">
                            <i class="bi bi-journal-bookmark me-2 text-primary"></i> Subject
                        </label>
                        <select id="subject" name="subject" class="form-select" required>
                            <option value="" disabled selected>Select subject...</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.name }}">{{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="exam_type" class="form-label">
                            <i class="bi bi-layers me-2 text-primary"></i> Assessment Type
                        </label>
                        <select id="exam_type" name="exam_type" class="form-select" required>
                            <option value="" disabled selected>Select type...</option>
                            <option value="Quiz">Quiz</option>
                            <option value="Midterm">Midterm</option>
                            <option value="Final">Final</option>
                            <option value="Assignment">Assignment</option>
                        </select>
                    </div>
                </div>
                
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="marks_obtained" class="form-label">
                            <i class="bi bi-check2-circle me-2 text-success"></i> Score Obtained
                        </label>
                        <input type="number" id="marks_obtained" name="marks_obtained" class="form-control" required min="0" step="0.5" placeholder="0.0">
                    </div>
                    <div class="col-md-6">
                        <label for="total_marks" class="form-label">
                            <i class="bi bi-slash-circle me-2 text-dim"></i> Out Of
                        </label>
                        <input type="number" id="total_marks" name="total_marks" class="form-control" value="100" min="1" step="0.5">
                    </div>
                </div>
                
                <div class="mb-5">
                    <label for="exam_date" class="form-label">
                        <i class="bi bi-calendar-check me-2 text-primary"></i> Examination Date
                    </label>
                    <input type="date" id="exam_date" name="exam_date" class="form-control" required>
                </div>
                
                <div class="d-flex gap-3 mt-4">
                    <a href="{{ url_for('marks') }}" class="btn btn-outline-light flex-grow-1 py-3">
                        Discard
                    </a>
                    <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                        <i class="bi bi-award me-2"></i> Register Marks
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('exam_date').valueAsDate = new Date();
</script>
{% endblock %}
