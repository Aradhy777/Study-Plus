{% extends "base.html" %}

{% block title %}StudyPulse | Add Mark{% endblock %}

{% block content %}
<h1 class="page-title">Add Exam Marks</h1>

<div class="card" style="max-width: 500px;">
    <form method="POST" action="{{ url_for('add_mark') }}">
        <div class="form-group">
            <label for="subject">Subject *</label>
            <select id="subject" name="subject" class="form-control" required>
                <option value="">Select a subject</option>
                {% for subject in subjects %}
                <option value="{{ subject.name }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="exam_type">Exam Type *</label>
            <select id="exam_type" name="exam_type" class="form-control" required>
                <option value="">Select exam type</option>
                <option value="Quiz">Quiz</option>
                <option value="Midterm">Midterm</option>
                <option value="Final">Final</option>
                <option value="Assignment">Assignment</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="marks_obtained">Marks Obtained *</label>
            <input type="number" id="marks_obtained" name="marks_obtained" class="form-control" required min="0" step="0.5">
        </div>
        
        <div class="form-group">
            <label for="total_marks">Total Marks</label>
            <input type="number" id="total_marks" name="total_marks" class="form-control" value="100" min="1" step="0.5">
        </div>
        
        <div class="form-group">
            <label for="exam_date">Exam Date *</label>
            <input type="date" id="exam_date" name="exam_date" class="form-control" required>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Add Marks</button>
            <a href="{{ url_for('marks') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
