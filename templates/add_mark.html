{% extends "base.html" %}

{% block title %}StudyPulse | Add Mark{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('marks') }}" class="btn btn-outline-light glass me-3 px-3">←</a>
            <h1 class="page-title mb-0">Add Exam Marks</h1>
        </div>

        <div class="card p-4">
            <form method="POST" action="{{ url_for('add_mark') }}">
                <div class="mb-4">
                    <label for="subject" class="form-label text-muted small fw-bold text-uppercase">Subject *</label>
                    <select id="subject" name="subject" class="form-select glass" required>
                        <option value="">Select a subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.name }}">{{ subject.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="exam_type" class="form-label text-muted small fw-bold text-uppercase">Exam Type *</label>
                    <select id="exam_type" name="exam_type" class="form-select glass" required>
                        <option value="">Select exam type</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Midterm">Midterm</option>
                        <option value="Final">Final</option>
                        <option value="Assignment">Assignment</option>
                    </select>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="marks_obtained" class="form-label text-muted small fw-bold text-uppercase">Marks Obtained *</label>
                        <input type="number" id="marks_obtained" name="marks_obtained" class="form-control glass" required min="0" step="0.5">
                    </div>
                    <div class="col-md-6">
                        <label for="total_marks" class="form-label text-muted small fw-bold text-uppercase">Total Marks</label>
                        <input type="number" id="total_marks" name="total_marks" class="form-control glass" value="100" min="1" step="0.5">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="exam_date" class="form-label text-muted small fw-bold text-uppercase">Exam Date *</label>
                    <input type="date" id="exam_date" name="exam_date" class="form-control glass" required>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                    <a href="{{ url_for('marks') }}" class="btn btn-outline-light glass me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Save Results</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
