{% extends "base.html" %}

{% block title %}StudyPulse | Add Subject{% endblock %}

{% block content %}
<h1 class="page-title">Add New Subject</h1>

<div class="card" style="max-width: 500px;">
    <form method="POST" action="{{ url_for('add_subject') }}">
        <div class="form-group">
            <label for="name">Subject Name *</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="target_hours">Target Study Hours</label>
            <input type="number" id="target_hours" name="target_hours" class="form-control" value="10" step="0.5">
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Add Subject</button>
            <a href="{{ url_for('subjects') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
