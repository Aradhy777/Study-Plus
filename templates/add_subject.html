{% extends "base.html" %}

{% block title %}StudyPulse | Add Subject{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('subjects') }}" class="btn btn-outline-light glass me-3 px-3">←</a>
            <h1 class="page-title mb-0">Add New Subject</h1>
        </div>

        <div class="card p-4">
            <form method="POST" action="{{ url_for('add_subject') }}">
                <div class="mb-4">
                    <label for="name" class="form-label text-muted small fw-bold text-uppercase">Subject Name *</label>
                    <input type="text" id="name" name="name" class="form-control glass" placeholder="e.g. Physics, Marketing" required>
                </div>
                
                <div class="mb-4">
                    <label for="target_hours" class="form-label text-muted small fw-bold text-uppercase">Target Study Hours</label>
                    <input type="number" id="target_hours" name="target_hours" class="form-control glass" value="10" step="0.5">
                    <div class="form-text text-muted small">Hours you plan to study per week.</div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                    <a href="{{ url_for('subjects') }}" class="btn btn-outline-light glass me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Create Subject</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
