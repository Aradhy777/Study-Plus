{% extends "base.html" %}

{% block title %}StudyPulse | Add Subject{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6 reveal">
        <div class="text-center mb-5">
            <h1 class="page-title">Initialize <span class="text-gradient-primary">Module</span></h1>
            <p class="text-muted">Define a new subject to track your progress effectively.</p>
        </div>

        <div class="card p-5 border-0 shadow-2xl">
            <form method="POST" action="{{ url_for('add_subject') }}">
                <div class="mb-4">
                    <label for="name" class="form-label">
                        <i class="bi bi-tag me-2"></i> Subject Designation
                    </label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Quantum Mechanics, Macroeconomics" required>
                </div>
                
                <div class="mb-5">
                    <label for="target_hours" class="form-label">
                        <i class="bi bi-bullseye me-2"></i> Target Weekly Quota (Hours)
                    </label>
                    <input type="number" id="target_hours" name="target_hours" class="form-control" value="10" step="0.5">
                    <div class="form-text text-dim small mt-2">
                        <i class="bi bi-info-circle me-1"></i> This helps us calculate your priority levels.
                    </div>
                </div>
                
                <div class="d-flex gap-3 mt-4">
                    <a href="{{ url_for('subjects') }}" class="btn btn-outline-light flex-grow-1 py-3">
                        Discard
                    </a>
                    <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                        <i class="bi bi-check2-circle me-2"></i> Initialize Subject
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
